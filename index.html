<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caterpillar Race</title>
<meta name="description" content="Draw circles to race your caterpillar. Challenge a friend with a link, no download.">
<meta property="og:title" content="Caterpillar Race">
<meta property="og:description" content="Draw circles to race. Challenge a friend with one link.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#d6efff,#0d2231);--ink:light-dark(#10301f,#e9f7ee);--card:light-dark(#ffffff,#15354a);--muted:light-dark(#3b5a49,#a9c7b5);--title:light-dark(#1f7a2b,#86e070);--seg:light-dark(#e6f5ff,#0d2231);--on:light-dark(#2f9e3a,#3fae48);--orange:#ff8a2a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Baloo 2",system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
.top{max-width:1240px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(4vw,14px) 8px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0;font-weight:800;color:var(--title)}
.top p{margin:4px 0 0;max-width:64ch;color:var(--muted)}
.stage{position:relative;height:clamp(400px,70vh,660px);max-width:1240px;margin:0 auto;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.ov{position:absolute;inset:30px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;pointer-events:none}
.panel{max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;pointer-events:auto;background:var(--card);color:var(--ink);border-radius:20px;padding:16px 18px;width:min(440px,100%);box-shadow:0 14px 40px rgba(0,40,20,.28);text-align:center;user-select:text;-webkit-user-select:text}
.panel h2{margin:0 0 6px;font-size:30px;line-height:1.05;font-weight:800}
.seg{display:flex;gap:5px;background:var(--seg);padding:4px;border-radius:14px;margin:8px 0}
.seg button,.sec{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:700 15px "Baloo 2",system-ui,sans-serif;cursor:pointer;padding:0 6px}
.seg button.on{background:var(--on);color:#fff}
.go{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--orange);color:#2a1200;font:800 22px "Baloo 2",system-ui,sans-serif;margin-top:10px;cursor:pointer;box-shadow:0 4px 0 #c45a0c}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #c45a0c}
.go:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;margin-top:8px}
.sec{background:var(--seg)}
button:focus-visible,input:focus-visible{outline:3px solid #ffb84d;outline-offset:2px}
.small{font-size:14px;color:var(--muted);margin:8px 0 0}
label{display:block;text-align:left;font-weight:700;font-size:14px;margin:10px 0 4px}
input[type=text]{width:100%;min-height:46px;border:2px solid color-mix(in srgb,var(--ink) 20%,transparent);border-radius:12px;padding:0 12px;font:600 17px "Baloo 2",system-ui,sans-serif;background:var(--seg);color:var(--ink)}
.code{font:800 40px/1 "Baloo 2",system-ui,sans-serif;letter-spacing:.12em;margin:4px 0}
.link{font-size:13px;color:var(--muted);overflow-wrap:anywhere;margin:2px 0 0}
.players{list-style:none;padding:0;margin:10px 0 0;text-align:left}
.players li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--seg);margin-top:6px;font-weight:700}
.players .dot{width:12px;height:12px;border-radius:50%;flex:none}
.players .st{margin-left:auto;font-size:14px;color:var(--muted)}
.players .ok{color:var(--on)}
table{width:100%;border-collapse:collapse;margin:6px 0 2px;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;text-align:right;white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left;white-space:normal}
.rk th:nth-child(2),.rk td:nth-child(2){text-align:left;white-space:normal}
tbody tr+tr td{border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.foot{max-width:1240px;margin:0 auto;padding:12px max(4vw,14px) 28px;font-size:14px;color:var(--muted)}
.foot p{margin:2px 0;max-width:70ch}
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 6px}
.chars button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;min-height:64px;padding:4px 2px;border:2px solid transparent;border-radius:12px;background:var(--seg);color:var(--ink);font:700 12px/1.1 "Baloo 2",system-ui,sans-serif;cursor:pointer}
.chars button.on{border-color:var(--on);background:color-mix(in srgb,var(--on) 14%,var(--seg))}
.chars img{width:100%;max-width:64px;height:38px;object-fit:contain}.chars span{font-size:11px;word-break:keep-all;text-align:center}.seg.tabs{margin-bottom:6px}
.ic{display:inline-block;width:30px;height:18px;vertical-align:-4px;margin-right:4px}.ic img{width:100%;height:100%;object-fit:contain}
.steps{display:flex;gap:6px;justify-content:center;margin:0 0 6px}.steps i{width:28px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 14%,transparent)}.steps i.on{background:var(--on)}
.modes{display:grid;gap:8px;margin:8px 0 0}.modes button{display:flex;align-items:center;gap:12px;text-align:left;min-height:62px;padding:8px 12px;border:2px solid transparent;border-radius:14px;background:var(--seg);color:var(--ink);font:inherit;cursor:pointer}
.modes button.on{border-color:var(--on);background:color-mix(in srgb,var(--on) 14%,var(--seg))}.modes .em{font-size:26px;width:34px;text-align:center;flex:none}.modes b{display:block;font-size:17px;line-height:1.2}.modes small{display:block;font-size:13px;color:var(--muted);line-height:1.25}
.row.nav .go{flex:2;margin-top:0}.row.nav .sec{min-height:54px}
.seg.cap button{padding:0;min-width:0}.seg.diff4 button{padding:0 2px;min-width:0;font-size:14px}.seg button:disabled{opacity:.5;cursor:not-allowed}
.codein{text-align:center;font-size:30px!important;letter-spacing:.4em;font-weight:800!important}
.players li.empty{background:transparent;border:2px dashed color-mix(in srgb,var(--ink) 20%,transparent);color:var(--muted);justify-content:center;font-weight:600}
.go.alt{background:var(--on);color:#fff;box-shadow:0 4px 0 #1f6e28;font-size:19px}
.go.small{font-size:18px;min-height:46px;margin-top:0}.row>button.go{width:auto;flex:2;margin-top:0}.row>button.sec{flex:1}
.quit{position:absolute;right:10px;bottom:10px;pointer-events:auto;min-height:40px;padding:0 14px;border:0;border-radius:12px;background:rgba(255,255,255,.88);color:#14301f;font:800 15px "Baloo 2",system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.panel img.card{display:block;width:100%;max-width:330px;margin:6px auto;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}.panel img.card.mini{max-width:210px;margin:2px auto 4px}.cardbtn{display:block;margin:0 auto;padding:0;border:0;background:none;cursor:zoom-in;border-radius:14px}
.panel.confirm{width:min(320px,100%)}.panel.confirm .row button{flex:1;width:auto;min-height:46px;margin-top:0}.panel.confirm p{margin:0 0 4px;font-size:18px}
.done{position:absolute;left:12px;bottom:12px;pointer-events:auto;min-height:44px;padding:0 20px;border:0;border-radius:12px;background:#fff;color:#14301f;font:800 17px "Baloo 2",system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.snd{float:right;display:flex;gap:4px}.snd button{border:0;background:var(--seg);border-radius:10px;color:var(--ink);font:700 13px "Baloo 2",sans-serif;min-height:40px;padding:0 10px;cursor:pointer}.snd button[aria-pressed=false]{opacity:.6}
.panel{position:relative}
.homeb{position:absolute;left:8px;top:8px;width:40px;height:40px;border:0;border-radius:12px;background:var(--seg);font-size:20px;line-height:1;cursor:pointer;z-index:2}
.panel:has(.homeb)>h2{padding:2px 40px 0}
.me{display:flex;align-items:center;gap:8px;width:100%;background:var(--seg);border-radius:14px;padding:6px 8px;margin:0 0 8px;color:var(--ink);text-align:left}
.me button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}.me .mt{min-width:0;flex:1}
.me .nmb{display:block;text-align:left;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.me .sub{display:flex;align-items:center;gap:6px;margin-top:2px}.me .sub small{flex:1;min-width:0}.me .nmb span{font-size:14px}
.namebox .x{left:auto;right:8px}.namebox h2{font-size:24px;padding:4px 40px 0}
.me .ic2 img{width:64px;height:38px;object-fit:contain;display:block}.me .mt b{display:inline;font-size:18px;line-height:1.2}.me .mt small{color:var(--muted);font-size:12.5px}
.me .ed{margin-left:auto;flex:none;font-weight:800!important;font-size:12.5px!important;color:var(--on)!important;border:2px solid var(--on)!important;border-radius:10px;padding:2px 7px!important;line-height:1.3}
.panel.home h2{margin:2px 0 8px;font-size:26px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:118px;padding:10px 10px 9px;border:0;border-radius:16px;color:#fff;text-align:left;font:inherit;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.tile .e{font-size:30px;line-height:1}.tile b{font-size:18px;line-height:1.1}.tile small{font-size:12px;line-height:1.2;opacity:.95}
.tile.c1{background:#e8701a}.tile.c2{background:#2f9e3a}.tile.c3{background:#3f6be0}.tile.c4{background:#9a45c4}
.tile .live{display:inline-flex;align-items:center;gap:4px;margin-top:auto;background:rgba(255,255,255,.25);border-radius:8px;padding:0 6px;font-size:11.5px;font-weight:800}.tile .live[hidden]{display:none}.tile .live i{width:7px;height:7px;border-radius:50%;background:#bfff6a}
.chars button.lk img{filter:grayscale(1);opacity:.45}.chars button.lk span{color:var(--muted)}
.chars button.gold:not(.lk){background:linear-gradient(#fff4c2,#ffd86b);color:#5a3a00}
.chars button:disabled{opacity:.35;cursor:not-allowed}
.nm{font:800 22px "Baloo 2",system-ui,sans-serif;margin:0;text-align:left}
.row>input{flex:1}
.lvs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:8px 0}
.lvs button{min-height:46px;border:2px solid transparent;border-radius:12px;background:var(--seg);color:var(--ink);font:800 17px "Baloo 2",system-ui,sans-serif;cursor:pointer;padding:0;line-height:1}
.lvs button small{display:block;font-size:11px}
.lvs button.ok{background:color-mix(in srgb,var(--on) 22%,var(--seg))}.lvs button.cur{border-color:var(--orange)}.lvs button:disabled{opacity:.45;cursor:default}
.go.pulse{animation:pulse .5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 4px 0 #c45a0c,0 0 0 0 rgba(255,138,42,.7)}50%{transform:scale(1.05);box-shadow:0 4px 0 #c45a0c,0 0 0 10px rgba(255,138,42,0)}}
.waitu{margin:8px 0 0;font-weight:800;color:#c4560c;font-size:16px}
@media (prefers-reduced-motion:reduce){.go.pulse{animation:none;outline:3px solid #ffb84d}}
.switchb{position:absolute;left:10px;right:10px;top:10px;pointer-events:auto;min-height:44px;border:0;border-radius:14px;background:#2f9e3a;color:#fff;font:700 16px "Baloo 2",system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 0 #1f6e28}
.spin{--p:0deg;width:110px;height:110px;margin:4px auto 4px;border-radius:50%;background:conic-gradient(var(--on) var(--p),color-mix(in srgb,var(--ink) 12%,transparent) 0);display:flex;align-items:center;justify-content:center}
.spin span{width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px}
.big{font-size:52px;line-height:1.1;margin-top:4px}
.panel.unlock{background:radial-gradient(circle at 50% 30%,#fff7c8,var(--card) 70%)}
.panel.unlock.legend{background:radial-gradient(circle at 50% 30%,#ffe27a,#ffb347 55%,#7a3cff);color:#2a1200}
.lvc{margin:0;font:800 20px "Baloo 2",system-ui,sans-serif;color:#c4560c;letter-spacing:.02em}.legend .lvc{color:#4a1a00}
.uls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0}
.ul{margin:0;flex:1 1 120px;max-width:260px}.ul img{width:100%;max-height:150px;object-fit:contain;animation:pop .6s ease-out}
.ul figcaption b{display:block;font-size:20px}.ul figcaption small{display:block;font-size:14px}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.go.goldb{background:linear-gradient(#ffe27a,#ffb300);box-shadow:0 4px 0 #a36a00}
.homeb.backb{left:54px;font-weight:800;font-size:22px;color:var(--ink)}
.panel:has(.backb)>h2{padding:6px 0 0 100px;text-align:left;font-size:24px;min-height:44px}
.lvstrip{margin:2px 0 6px}.lvstrip .cells{display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.lvstrip i{height:12px;border-radius:3px;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.lvstrip i.ok{background:var(--on)}.lvstrip i.nx{background:#fff;box-shadow:inset 0 0 0 2.5px var(--orange)}
.lvstrip i.dg:not(.ok){background:#ffe27a}.lvstrip i.kg:not(.ok){background:#c9a6ff}
.lvstrip .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.tile .minibar{display:block;width:100%;height:5px;margin-top:4px;border-radius:3px;background:rgba(255,255,255,.3)}.tile .minibar i{display:block;height:100%;border-radius:3px;background:#fff}
.players li.botli{background:#fff1dc}.players li.botli b{color:#c4560c}
.rmb{margin-left:6px;border:0;border-radius:8px;background:#ffe1d6;color:#a32118;font-weight:800;width:30px;height:30px;cursor:pointer;flex:none}
.addb{width:100%;margin-top:6px;min-height:46px;border:2px dashed #e8701a;border-radius:14px;background:#fff7ec;color:#c4560c;font:800 17px "Baloo 2",system-ui,sans-serif;cursor:pointer}
.tile.wide{grid-column:span 2;min-height:104px}
.tile.c5{background:#5b6b7a}.tile.small{min-height:78px}.tile.small .e{font-size:22px}
.panel.mappanel{padding:0;overflow-y:auto;overflow-x:hidden}
.mappanel .homeb{position:sticky;top:8px;margin:8px 0 -48px 8px;display:block}
.mapsvg{display:block}.mnode{cursor:pointer}.mnode:focus{outline:none}.mnode:focus-visible circle{stroke:#1f6ea8}
.bigemo{font-size:52px;line-height:72px;height:72px;display:block}
.vs{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}.vs>div{display:flex;flex-direction:column;align-items:center}.vs b{font:800 22px "Baloo 2",sans-serif;color:#c4560c}
.vs small{font-size:12px;font-weight:700;color:var(--muted)}img.big{width:120px;height:72px;object-fit:contain}
.mstart .lvc{font-size:28px}.goal{font:800 18px "Baloo 2",sans-serif;margin:4px 0 8px}
.lore{text-align:left;background:#eef7f3;color:#1f4a3f;border-radius:12px;padding:8px 10px;font-size:14px;margin:0 0 8px}
.stars3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 10px}.stars3 div{background:#fff7e0;color:#6a4a00;border-radius:10px;padding:6px 4px;font-size:12px;font-weight:700}.stars3 b{display:block;font-size:13px}
.stars3 div.got{background:#e3f6d8;color:#2f6a1f;box-shadow:inset 0 0 0 2px #2f9e3a}
.bigstars{font-size:40px;line-height:1;margin:2px 0;color:#ffc61a;letter-spacing:4px}.bigstars span{color:#d5dde2}
.vidbar{pointer-events:auto;margin-top:auto;max-width:min(560px,96%);background:rgba(255,255,255,.95);border-radius:16px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:6px}
.vidbar .vt{display:flex;align-items:center;gap:8px;font-size:18px}.vidbar .vt img{width:44px;height:28px;object-fit:contain}.vidbar p{margin:0;font-size:15px}.vidbar button{align-self:flex-end}
.acard .acpic img{width:180px;height:110px;object-fit:contain}.acard .lkpic img{filter:brightness(0) opacity(.45)}.acard .fact{background:#eef7f3;color:#1f4a3f;border-radius:12px;padding:8px 10px;text-align:left}
.mappanel .endb{position:sticky;top:8px;float:right;margin:8px 8px -48px 0;z-index:2}
@media(min-width:900px){.stage{border-radius:22px;width:calc(100% - 8vw)}}
</style>
</head>
<body>
<header class="top">
  <div class="snd"><button id="bMusic" type="button" aria-pressed="true"></button><button id="bSfx" type="button" aria-pressed="true"></button></div>
  <h1 id="h1">Caterpillar Race</h1>
  <p id="intro"></p>
</header>
<main class="stage">
  <canvas id="cv" aria-label="Race track"></canvas>
  <div id="ov" class="ov"></div>
</main>
<footer class="foot"><p id="foot"></p></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="game.js"></script>
</body>
</html>
